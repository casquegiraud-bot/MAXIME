<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#102632">
<title>Maxime, le petit mécanicien — V5</title>
<style>
:root{--ink:#142630;--blue:#1597d0;--cyan:#46d1ee;--yellow:#ffd23c;--orange:#ff8b42;--green:#68d27c;--cream:#fff8e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cfc5b5;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
body{touch-action:manipulation}
#app{height:100dvh;display:grid;grid-template-rows:auto 1fr 28px;background:linear-gradient(#0000 96%,#0001 96%),linear-gradient(90deg,#0000 96%,#0001 96%),#d8cfbf;background-size:30px 30px}
header{background:#172a34;color:#fff;border-bottom:6px solid var(--yellow);box-shadow:0 5px 14px #0005;z-index:5;padding:8px 10px 10px}
.titlebar{text-align:center;font-weight:1000;font-size:clamp(22px,6vw,32px);line-height:1}.titlebar b{color:var(--yellow)}
.navbar{height:64px;display:flex;align-items:center;justify-content:center;margin-top:4px}
#back{display:none;border:0;border-radius:18px;background:var(--blue);color:#fff;font-weight:1000;font-size:21px;min-height:54px;padding:8px 24px;box-shadow:0 5px 0 #0c6288}
#back:active{transform:translateY(3px);box-shadow:0 2px 0 #0c6288}
.stars{position:absolute;right:12px;color:#ffe678;font-size:19px;font-weight:1000}
main{overflow:auto;padding:10px 12px 18px}.screen{min-height:100%;max-width:920px;margin:auto;overflow:auto;padding:2px 2px 18px}
.intro{text-align:center;margin:0 0 10px}.intro h1,.intro h2{margin:0;font-size:clamp(25px,7vw,38px)}.intro p{margin:5px 0;font-weight:750}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.card{position:relative;min-height:152px;background:var(--cream);border:4px solid var(--ink);border-radius:25px;box-shadow:0 7px 0 #6d655a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;overflow:hidden;user-select:none}
.card:active{transform:translateY(4px);box-shadow:0 3px 0 #6d655a}.card h3{margin:5px 0 0;font-size:18px;line-height:1;text-align:center}
.preview{width:135px;height:100px}.preview canvas{width:100%;height:100%}.activity{min-height:120px}.activity .emoji{font-size:42px}.badge{position:absolute;top:7px;right:7px;background:#172a34;color:#fff;border-radius:15px;padding:3px 7px;font-size:11px;font-weight:900}
#game{display:none;width:100%;max-width:920px;margin:auto;padding-bottom:18px}
.gamebox{display:grid;grid-template-rows:auto auto auto auto;gap:10px;background:#fff8e8;border:4px solid var(--ink);border-radius:24px;padding:10px;box-shadow:0 7px 0 #6d655a}
#gameTitle{margin:2px 0 0;text-align:center;font-size:clamp(22px,5.2vw,30px)}#instruction{margin:0 auto;text-align:center;min-height:42px;max-width:760px;font-size:clamp(14px,2.6vw,18px);font-weight:800}
.canvasWrap{position:relative;width:100%;aspect-ratio:720/1000;min-height:620px;max-height:none}#cv{display:block;width:100%;height:auto;aspect-ratio:720/1000;border:3px solid var(--ink);border-radius:18px;background:#e0f5f8;touch-action:none}
.controls{min-height:74px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:4px 0 8px}.controls label{width:min(96%,430px);font-weight:900;text-align:center}.controls input{width:100%;height:42px;accent-color:var(--orange)}
.btn{border:0;border-radius:16px;background:#fff;color:var(--ink);font-weight:950;min-height:52px;padding:10px 16px;box-shadow:0 4px 0 #8a8175}.big{font-size:17px;background:var(--yellow)}
.success{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:20;padding:20px}
.success>div{width:min(92vw,430px);background:#fff;border:6px solid var(--ink);border-radius:30px;padding:24px;text-align:center;box-shadow:0 12px 0 #0005;animation:pop .22s}
.success .flags{font-size:48px}.success b{font-size:30px}@keyframes pop{from{transform:scale(.6)}}
footer{text-align:center;background:#172a34;color:#ccc;padding:6px;font-size:10px}

@media (min-width:760px) and (orientation:portrait){
  header{padding:10px 16px 12px}
  .titlebar{font-size:34px}
  .navbar{height:66px}
  #back{font-size:22px;min-height:58px;padding:10px 30px}
  main{padding:12px 18px 22px}
  #game,.screen{max-width:900px}
  .gamebox{padding:14px;gap:12px}
  .canvasWrap{min-height:760px}
  .controls{min-height:84px}
  .controls label{max-width:620px;font-size:19px}
  .controls input{height:50px}
}

</style></head>
<body>
<div id="app">
<header>
  <div class="titlebar"><b>MAXIME</b> — LE PETIT MÉCANICIEN</div>
    <div class="navbar"><button id="back">⬅ RETOUR</button><div class="stars" id="stars">★ 0</div></div>
</header>
<main>
<section id="home" class="screen">
  <div class="intro"><h1>Choisis ta machine</h1><p>Chaque machine possède son propre mécanisme.</p></div>
  <div class="grid" id="objects"></div>
</section>
<section id="menu" class="screen" style="display:none">
  <div class="intro"><h2 id="objTitle"></h2><p>Choisis ton atelier.</p></div><div class="grid" id="activities"></div>
</section>
<section id="game"><div class="gamebox"><h2 id="gameTitle"></h2><p id="instruction"></p><div class="canvasWrap"><canvas id="cv" width="900" height="1250"></canvas></div><div class="controls" id="controls"></div></div></section>
</main>
<footer>Toucher • glisser • frotter • tourner • observer</footer>
</div>
<div class="success" id="success"><div><div class="flags">🚩 ✨ 🎉 ✨ 🚩</div><b>BRAVO MAXIME !</b><p>Mission réussie !</p><button class="btn big" id="continueBtn">CONTINUER</button></div></div>

<script>
const O=[
{name:"Aspirateur robot",kind:"robot"},
{name:"Ventilateur",kind:"fan"},
{name:"Machine à laver",kind:"washer"},
{name:"Éolienne",kind:"wind"},
{name:"Hélicoptère",kind:"heli"},
{name:"Engrenages",kind:"gears"},
{name:"Roue de kart",kind:"wheel"},
{name:"Moulin à eau",kind:"mill"},
{name:"Toupie",kind:"top"},
{name:"Turbine",kind:"turbine"}
];
const A=[
["Mode libre","🌀","Marche, arrêt et vitesse : observe le mécanisme tourner."],
["Démonter & remonter","🧰","Démonte les vraies pièces, puis remonte-les avec les couleurs."],
["Puzzle","🧩","Reconstitue le puzzle en t’aidant du modèle fixe."],
["Memory","🃏","Retourne les 16 cartes et retrouve les 8 paires."],
["Bonne vitesse","🎯","Rattrape la zone verte qui se déplace avec le curseur."],
["Pièce mystère","🔍","Glisse la bonne pièce dans la silhouette noire."],
["Nettoyage","🧽","Frotte longtemps pour faire disparaître toute la saleté."],
["Atelier rotation","👆","Fais tourner directement la pièce avec ton doigt pendant 20 tours."],
["Atelier peinture","🎨","Choisis une couleur et peins toute la machine avec le pistolet."],
["Chef mécanicien","🔧","Fais 20 tours pour dévisser, puis 20 tours pour revisser la grosse fixation."]
];
let sel=0,game=0,stars=0,ang=0,speed=.035,raf=null,won=false,paused=false;
const $=s=>document.querySelector(s),cv=$("#cv"),c=cv.getContext("2d");
let drag=null,assembly=[],phase="remove",puzzle=[],cards=[],first=null,matched=0,dirt=[],spinAccum=0,lastA=0,greenX=230,greenDir=1,targetTimer=0,mission=0,mystery=[],chiefStage=0;
let paintColor="#1597d0",paintDots=[],paintProgress=0,wrenchAngle=0,wrenchAccum=0,wrenchPhase=0;

function show(id){["home","menu","game"].forEach(x=>$("#"+x).style.display=x===id?"block":"none");$("#back").style.display=id==="home"?"none":"block"}
$("#back").onclick=()=>{cancelAnimationFrame(raf);paused=false;won=false;$("#success").style.display="none";if($("#game").style.display==="block")show("menu");else show("home")};
$("#continueBtn").onclick=()=>{$("#success").style.display="none";paused=false;won=false;cancelAnimationFrame(raf);show("menu")};

function rr(x,X,Y,W,H,R,fill,stroke="#142630",lw=5){x.beginPath();x.roundRect(X,Y,W,H,R);x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.stroke()}}
function circle(x,X,Y,R,fill,stroke="#142630",lw=5){x.beginPath();x.arc(X,Y,R,0,Math.PI*2);x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.stroke()}}
function line(x,a,b,col="#142630",lw=6){x.beginPath();x.moveTo(...a);x.lineTo(...b);x.strokeStyle=col;x.lineWidth=lw;x.stroke()}
function blade(x,len,w,col){x.beginPath();x.moveTo(8,-w/2);x.quadraticCurveTo(len*.68,-w,len,0);x.quadraticCurveTo(len*.68,w,8,w/2);x.closePath();x.fillStyle=col;x.fill();x.strokeStyle="#142630";x.lineWidth=4;x.stroke()}
function gear(x,cx,cy,r,n,a,col){x.save();x.translate(cx,cy);x.rotate(a);x.beginPath();for(let i=0;i<n*2;i++){let q=i*Math.PI/n,R=i%2?r:r*.76;x.lineTo(Math.cos(q)*R,Math.sin(q)*R)}x.closePath();x.fillStyle=col;x.fill();x.strokeStyle="#142630";x.lineWidth=5;x.stroke();circle(x,0,0,r*.22,"#eee6d3");x.restore()}

function drawObject(x,k,cx,cy,s,a,col="#f2ac3f"){
 x.save();x.translate(cx,cy);x.scale(s,s);
 if(k==="fan"){rr(x,-18,55,36,75,12,"#526872");rr(x,-75,125,150,28,14,"#526872");circle(x,0,0,105,"#d9eef2","#142630",7);x.save();x.rotate(a);for(let i=0;i<5;i++){x.rotate(Math.PI*2/5);blade(x,82,30,col)}x.restore();circle(x,0,0,20,"#ffd33d");for(let r=38;r<105;r+=22){x.beginPath();x.arc(0,0,r,0,7);x.strokeStyle="#526872";x.lineWidth=2;x.stroke()}}
 else if(k==="robot"){circle(x,0,0,112,col,"#142630",8);circle(x,0,-10,70,"#354750","#142630",5);circle(x,0,-10,18,"#35c6e8");x.save();x.translate(-82,72);x.rotate(a*2);for(let i=0;i<3;i++){x.rotate(2.094);line(x,[0,0],[42,0],col,7)}x.restore();x.save();x.translate(82,72);x.rotate(-a*2);for(let i=0;i<3;i++){x.rotate(2.094);line(x,[0,0],[42,0],col,7)}x.restore();x.save();x.translate(0,80);x.rotate(a*2);rr(x,-52,-12,104,24,10,"#69d17d");for(let i=-40;i<=40;i+=20)line(x,[i,-10],[i,10],"#142630",3);x.restore()}
 else if(k==="washer"){rr(x,-120,-145,240,290,22,"#f2f2ed");rr(x,-92,-112,184,42,10,"#d9e0e1");circle(x,0,30,90,"#354750","#142630",8);circle(x,0,30,69,"#a9dce8","#142630",4);x.save();x.translate(0,30);x.rotate(a);for(let i=0;i<10;i++){x.rotate(Math.PI/5);rr(x,30,-7,36,14,6,col,null)}x.restore();circle(x,0,30,22,"#6e8790",null)}
 else if(k==="wind"){rr(x,-12,10,24,170,8,"#e9ecec");x.save();x.rotate(a);for(let i=0;i<3;i++){x.rotate(2.094);blade(x,125,20,col)}x.restore();circle(x,0,0,22,"#ffd33d")}
 else if(k==="heli"){rr(x,-115,-25,190,70,34,col);rr(x,55,-10,120,20,8,col);circle(x,-50,-2,28,"#9ed9e6");line(x,[-60,-55],[55,-55]);x.save();x.translate(-5,-55);x.rotate(a);line(x,[-125,0],[125,0],col,9);x.restore();x.save();x.translate(170,0);x.rotate(a*1.8);line(x,[-35,0],[35,0],col,6);line(x,[0,-35],[0,35],col,6);x.restore()}
 else if(k==="gears"){gear(x,-55,20,72,14,a,col);gear(x,58,-20,55,12,-a*1.3,"#35c6e8");gear(x,45,78,35,10,a*1.8,"#e85d4a")}
 else if(k==="wheel"){circle(x,0,0,110,"#263238","#142630",5);circle(x,0,0,76,"#d9dde0","#142630",5);x.save();x.rotate(a);for(let i=0;i<8;i++){x.rotate(Math.PI/4);rr(x,10,-7,62,14,5,col,null)}x.restore();circle(x,0,0,25,"#ffb238")}
 else if(k==="mill"){x.save();x.rotate(a);for(let i=0;i<10;i++){x.rotate(Math.PI/5);rr(x,25,-14,95,28,4,col)}x.restore();circle(x,0,0,22,"#6b4931");line(x,[-150,0],[150,0],"#6b4931")}
 else if(k==="top"){x.save();x.rotate(a);x.beginPath();x.moveTo(0,-120);x.bezierCurveTo(95,-60,100,40,0,105);x.bezierCurveTo(-100,40,-95,-60,0,-120);x.fillStyle=col;x.fill();x.strokeStyle="#142630";x.lineWidth=6;x.stroke();rr(x,-12,-150,24,42,8,"#ffd33d");x.restore();x.beginPath();x.moveTo(-12,100);x.lineTo(0,145);x.lineTo(12,100);x.fillStyle="#555";x.fill()}
 else if(k==="turbine"){circle(x,0,0,115,"#435761","#142630",7);circle(x,0,0,93,"#d9eef2","#142630",4);x.save();x.rotate(a);for(let i=0;i<14;i++){x.rotate(Math.PI/7);x.beginPath();x.moveTo(12,-8);x.quadraticCurveTo(70,-35,88,-4);x.lineTo(25,10);x.closePath();x.fillStyle=i%2?col:"#35c6e8";x.fill()}x.restore();circle(x,0,0,25,"#ffd33d")}
 x.restore()
}
function preview(kind,can){let x=can.getContext("2d");x.clearRect(0,0,135,100);drawObject(x,kind,67,49,.58,performance.now()/750)}
O.forEach((o,i)=>{let d=document.createElement("div");d.className="card";d.innerHTML=`<div class="preview"><canvas width="135" height="100"></canvas></div><h3>${o.name}</h3>`;d.onclick=()=>{sel=i;$("#objTitle").textContent=o.name;show("menu")};$("#objects").append(d);let ca=d.querySelector("canvas");setInterval(()=>preview(o.kind,ca),42)});
A.forEach((a,i)=>{let d=document.createElement("div");d.className="card activity";d.innerHTML=`<span class="badge">${i+1}</span><div class="emoji">${a[1]}</div><h3>${a[0]}</h3>`;d.onclick=()=>start(i);$("#activities").append(d)});

function start(i){
 game=i;won=false;paused=false;ang=0;speed=.035;drag=null;spinAccum=0;greenX=230;greenDir=1;targetTimer=0;mission=0;chiefStage=0;first=null;matched=0;paintDots=[];paintProgress=0;paintColor="#1597d0";wrenchAngle=0;wrenchAccum=0;wrenchPhase=0;
 $("#gameTitle").textContent=A[i][1]+" "+O[sel].name+" — "+A[i][0];$("#instruction").textContent=A[i][2];$("#controls").innerHTML="";
 setup();show("game");cancelAnimationFrame(raf);loop()
}
function setup(){
 if(game===0){$("#controls").innerHTML=`<button id="toggle" class="btn big">⏯ MARCHE / ARRÊT</button><label>VITESSE<input id="spd" type="range" min="0" max="20" value="6"></label>`;$("#toggle").onclick=()=>speed=speed?0:.06;$("#spd").oninput=e=>speed=+e.target.value/100}
 else if(game===4){$("#controls").innerHTML=`<label>VITESSE<input id="spd" type="range" min="0" max="20" value="5"></label>`;$("#spd").oninput=e=>speed=+e.target.value/100}
 else if(game===8){
   $("#controls").innerHTML=`<button class="btn paint" data-c="#1597d0">🔵 BLEU</button><button class="btn paint" data-c="#ffd23c">🟡 JAUNE</button><button class="btn paint" data-c="#e95a4c">🔴 ROUGE</button><button class="btn paint" data-c="#68d27c">🟢 VERT</button>`;
   document.querySelectorAll(".paint").forEach(b=>b.onclick=()=>{paintColor=b.dataset.c;paintDots=[];paintProgress=0;$("#instruction").textContent="Peins toute la machine avec ton doigt. Tu peux changer de couleur quand tu veux."});
 }
 else $("#controls").innerHTML=`<button id="reset" class="btn big">↻ RECOMMENCER</button>`,$("#reset").onclick=()=>start(game);
 if(game===1)initAssembly();
 if(game===2)initPuzzle();
 if(game===3)initMemory();
 if(game===5)initMystery();
 if(game===6)initDirt();
}
function initAssembly(){
 phase="remove";assembly=[];const cols=["#ffd23c","#e95a4c","#35a9e0"];
 for(let m=0;m<3;m++)for(let p=0;p<3;p++)assembly.push({m,p,col:cols[m],x:170+m*190+(p-1)*18,y:410+p*55,homeX:170+m*190+(p-1)*20,homeY:410+p*55,removed:false,placed:false})
}
function initPuzzle(){puzzle=[];let order=[0,1,2,3,4,5,6,7,8].sort(()=>Math.random()-.5);order.forEach((id,i)=>puzzle.push({id,x:100+(i%3)*255,y:760+Math.floor(i/3)*85,tx:155+(id%3)*205,ty:245+Math.floor(id/3)*170,done:false}))}
function initMemory(){let vals=[0,1,2,3,4,5,6,7,0,1,2,3,4,5,6,7].sort(()=>Math.random()-.5);cards=vals.map((v,i)=>({v,x:95+(i%4)*175,y:235+Math.floor(i/4)*175,open:false,done:false}))}
function initMystery(){mystery=[];for(let i=0;i<5;i++)mystery.push({id:i,x:120+i*120,y:830,correct:i===2})}
function initDirt(){dirt=[];for(let i=0;i<125;i++)dirt.push({x:45+Math.random()*630,y:95+Math.random()*735,r:14+Math.random()*30,life:4+Math.floor(Math.random()*4)})}

function bg(){
  c.setTransform(1.25,0,0,1.25,0,0);
  c.fillStyle="#dff4f7";c.fillRect(0,0,720,700);
  c.fillStyle="#c89d68";c.fillRect(0,700,720,300);
  c.fillStyle="#8a6546";c.fillRect(0,700,720,22);
}
function mainMachine(alpha=1){c.save();c.globalAlpha=alpha;drawObject(c,O[sel].kind,360,420,1.48,ang);c.restore()}
function frame(){
 bg();
 if(game===1)drawAssembly();
 else if(game===2)drawPuzzle();
 else if(game===3)drawMemory();
 else {mainMachine(); if(game===4)drawGauge(); if(game===5)drawMystery(); if(game===6)drawDirt(); if(game===7)drawSpin(); if(game===8)drawPaint(); if(game===9)drawChief()}
}
function drawAssembly(){
 c.fillStyle="#142630";c.font="900 20px system-ui";c.textAlign="center";
 c.fillText(phase==="remove"?"DÉMONTE LES PIÈCES ET POSE-LES EN BAS":"REMETS LES PIÈCES DANS LE GRAND ROND DE LA BONNE COULEUR",360,88);
 const cols=["#ffd23c","#e95a4c","#35a9e0"];
 for(let m=0;m<3;m++){drawObject(c,O[sel].kind,170+m*190,340,.60,ang,cols[m]);if(phase==="replace"){c.beginPath();c.arc(170+m*190,430,95,0,7);c.strokeStyle=cols[m];c.lineWidth=12;c.stroke()}}
 assembly.forEach(q=>{
   if(phase==="remove"&&!q.removed)drawComponent(q,q.homeX,q.homeY);
   if(phase==="remove"&&q.removed)drawComponent(q,q.x,q.y);
   if(phase==="replace"&&!q.placed)drawComponent(q,q.x,q.y);
 });
}
function drawComponent(q,x,y){
 c.save();c.translate(x,y);let k=O[sel].kind;
 if(k==="robot"){if(q.p<2){c.rotate(ang*(q.p?-2:2));for(let i=0;i<3;i++){c.rotate(2.094);line(c,[0,0],[34,0],q.col,8)}}else{c.rotate(ang*2);rr(c,-35,-10,70,20,8,q.col)}}
 else if(["fan","wind","heli","turbine"].includes(k)){c.rotate(ang);for(let i=0;i<(k==="wind"?3:4);i++){c.rotate(Math.PI*2/(k==="wind"?3:4));blade(c,38,11,q.col)}circle(c,0,0,10,"#ffd33d")}
 else if(k==="gears"){gear(c,0,0,35,10,ang,q.col)}
 else if(k==="wheel"){circle(c,0,0,35,"#263238");circle(c,0,0,24,q.col)}
 else if(k==="mill"){c.rotate(ang);for(let i=0;i<8;i++){c.rotate(Math.PI/4);rr(c,10,-7,33,14,4,q.col)}}
 else if(k==="top"){c.rotate(ang);c.beginPath();c.moveTo(0,-38);c.lineTo(28,20);c.lineTo(0,38);c.lineTo(-28,20);c.closePath();c.fillStyle=q.col;c.fill();c.strokeStyle="#142630";c.lineWidth=4;c.stroke()}
 else if(k==="washer"){circle(c,0,0,36,"#9bd9e8");c.save();c.rotate(ang);for(let i=0;i<6;i++){c.rotate(Math.PI/3);rr(c,8,-4,22,8,3,q.col,null)}c.restore()}
 c.restore()
}
function jigsawPath(cx,cy,w,h,id){
 const col=id%3,row=Math.floor(id/3),tab=18;c.beginPath();c.moveTo(cx-w/2,cy-h/2);
 c.lineTo(cx-w/8,cy-h/2);if(row>0)c.bezierCurveTo(cx-w/10,cy-h/2-tab,cx+w/10,cy-h/2-tab,cx+w/8,cy-h/2);c.lineTo(cx+w/2,cy-h/2);
 c.lineTo(cx+w/2,cy-h/8);if(col<2)c.bezierCurveTo(cx+w/2+tab,cy-h/10,cx+w/2+tab,cy+h/10,cx+w/2,cy+h/8);c.lineTo(cx+w/2,cy+h/2);
 c.lineTo(cx+w/8,cy+h/2);if(row<2)c.bezierCurveTo(cx+w/10,cy+h/2+tab,cx-w/10,cy+h/2+tab,cx-w/8,cy+h/2);c.lineTo(cx-w/2,cy+h/2);
 c.lineTo(cx-w/2,cy+h/8);if(col>0)c.bezierCurveTo(cx-w/2-tab,cy+h/10,cx-w/2-tab,cy-h/10,cx-w/2,cy-h/8);c.closePath()
}
function drawPuzzlePiece(p){
 let x=p.x,y=p.y;jigsawPath(x,y,190,150,p.id);c.save();c.clip();let ox=x-(p.tx-360),oy=y-(p.ty-420);drawObject(c,O[sel].kind,ox,oy,1.15,0);c.restore();jigsawPath(x,y,190,150,p.id);c.strokeStyle="#142630";c.lineWidth=5;c.stroke()
}
function drawPuzzle(){
 c.fillStyle="#142630";c.font="900 18px system-ui";c.textAlign="center";c.fillText("MODÈLE",360,55);
 c.save();c.globalAlpha=.32;drawObject(c,O[sel].kind,360,325,1.18,0);c.restore();
 for(let id=0;id<9;id++){let tx=155+(id%3)*205,ty=245+Math.floor(id/3)*170;jigsawPath(tx,ty,190,150,id);c.fillStyle="#ffffff55";c.fill();c.strokeStyle="#14263033";c.lineWidth=2;c.stroke()}
 puzzle.forEach(p=>{if(p.done){let ox=p.x,oy=p.y;p.x=p.tx;p.y=p.ty;drawPuzzlePiece(p);p.x=ox;p.y=oy}else drawPuzzlePiece(p)})
}
function drawMemory(){
 c.fillStyle="#142630";c.font="900 18px system-ui";c.textAlign="center";c.fillText("RETROUVE LES 8 PAIRES",360,75);
 const icons=["⚙️","🔩","🛞","🔧","🌀","🧰","🔵","🟡"];
 cards.forEach(q=>{rr(c,q.x-63,q.y-65,126,130,18,q.open||q.done?"#fff7df":"#237f9f","#142630",5);c.font="50px system-ui";c.fillText(q.open||q.done?icons[q.v]:"?",q.x,q.y+17)})
}
function drawGauge(){
 greenX+=greenDir*1.65;if(greenX>430||greenX<165)greenDir*=-1;
 rr(c,70,755,580,115,25,"#fff","#142630",5);c.fillStyle="#e85d4a";c.fillRect(105,800,510,28);c.fillStyle="#69d17d";c.fillRect(greenX,795,95,38);
 let px=105+Math.min(510,speed/.2*510);c.fillStyle="#142630";c.beginPath();c.moveTo(px,785);c.lineTo(px-14,758);c.lineTo(px+14,758);c.closePath();c.fill();
 c.font="900 17px system-ui";c.textAlign="center";c.fillText("SUIS LA ZONE VERTE",360,905);
 if(px>=greenX&&px<=greenX+95){targetTimer++;if(targetTimer>120)win()}else targetTimer=Math.max(0,targetTimer-2)
}
function drawMystery(){
 c.fillStyle="#142630";c.font="900 18px system-ui";c.textAlign="center";c.fillText("GLISSE LA BONNE PIÈCE DANS LA SILHOUETTE",360,720);
 c.save();c.translate(360,470);gear(c,0,0,72,10,0,"#111");c.restore();
 mystery.forEach((q,i)=>{c.save();c.translate(q.x,q.y);gear(c,0,0,52+(i%2)*5,8+i,0,["#8da2aa","#f0a84a","#4ab8db","#e56a58","#6d8f77"][i]);c.restore()})
}
function drawDirt(){
 dirt.filter(d=>d.life>0).forEach(d=>{c.beginPath();c.arc(d.x,d.y,d.r,0,7);c.fillStyle=`rgba(102,72,50,${.28+.12*d.life})`;c.fill()});
 c.font="56px system-ui";c.fillText("🧽",600,850);c.fillStyle="#142630";c.font="900 18px system-ui";c.textAlign="center";c.fillText("FROTTE PARTOUT JUSQU’À CE QUE ÇA BRILLE",360,930);
 if(dirt.every(d=>d.life<=0)){c.font="70px system-ui";c.fillText("✨",360,240);win()}
}
function drawSpin(){c.beginPath();c.arc(360,420,190,0,7);c.strokeStyle="#36bfe099";c.lineWidth=14;c.setLineDash([25,17]);c.stroke();c.setLineDash([]);c.fillStyle="#142630";c.font="900 22px system-ui";c.textAlign="center";c.fillText("TOURNE AVEC TON DOIG",360,760);c.fillText(Math.min(20,Math.floor(spinAccum/(Math.PI*2)))+" / 20 TOURS",360,805);if(spinAccum>=Math.PI*40)win()}
function missionText(){return {robot:"Fais tourner les brosses et le rouleau pendant 12 tours.",fan:"Fais tourner les pales pendant 12 tours.",washer:"Fais tourner le tambour 10 tours.",wind:"Fais tourner les pales 12 tours.",heli:"Lance le rotor pendant 12 tours.",gears:"Entraîne les engrenages pendant 12 tours.",wheel:"Fais tourner la roue 12 tours.",mill:"Fais tourner la roue à aubes 12 tours.",top:"Lance la toupie pendant 15 tours.",turbine:"Fais tourner la turbine 15 tours."}[O[sel].kind]}
function drawMission(){rr(c,75,755,570,115,25,"#fff","#142630",5);c.fillStyle="#142630";c.font="900 18px system-ui";c.textAlign="center";wrap(missionText(),360,792,500,24);c.fillText("TOURS : "+Math.floor(mission/(Math.PI*2)),360,925);let need=(O[sel].kind==="top"||O[sel].kind==="turbine")?15:12;if(O[sel].kind==="washer")need=10;if(mission>=Math.PI*2*need)win()}
function drawPaint(){
  // stationary machine; paint appears where the child sprays
  c.save(); c.globalAlpha=.94;
  paintDots.forEach(d=>{c.beginPath();c.arc(d.x,d.y,d.r,0,Math.PI*2);c.fillStyle=d.col;c.fill()});
  c.restore();
  c.fillStyle="#142630";c.font="900 19px system-ui";c.textAlign="center";
  c.fillText("PEINS AVEC TON DOIG",360,785);
  rr(c,110,815,500,30,15,"#ffffff","#142630",4);
  rr(c,115,820,Math.min(490,490*paintProgress),20,10,paintColor,null,0);
  c.fillText(Math.floor(paintProgress*100)+" %",360,885);
  c.font="54px system-ui";c.fillText("🔫",620,940);
  if(paintProgress>=1)win()
}
function drawChief(){
  mainMachine(.25);
  c.fillStyle="#142630";c.font="900 20px system-ui";c.textAlign="center";
  c.fillText(wrenchPhase===0?"DÉVISSE LA GROSSE FIXATION":"REVISSSE LA GROSSE FIXATION",360,155);
  // large mechanical fixing
  circle(c,360,430,105,"#879aa2","#142630",8);
  c.save();c.translate(360,430);c.rotate(wrenchAngle);
  // nut
  c.beginPath();for(let i=0;i<6;i++){let a=i*Math.PI/3-Math.PI/6;c.lineTo(Math.cos(a)*58,Math.sin(a)*58)}c.closePath();c.fillStyle="#d9dde0";c.fill();c.strokeStyle="#142630";c.lineWidth=7;c.stroke();
  circle(c,0,0,18,"#566a73");
  // wrench handle
  rr(c,40,-18,210,36,16,"#ffd23c","#142630",6);
  circle(c,245,0,30,"#ffd23c","#142630",6);circle(c,245,0,13,"#dff4f7","#142630",4);
  c.restore();
  c.fillStyle="#142630";c.font="900 18px system-ui";
  c.fillText("TOURNE LA CLÉ AVEC TON DOIG",360,760);
  c.fillText(Math.min(20,Math.floor(wrenchAccum/(Math.PI*2)))+" / 20 TOURS",360,805);
  if(wrenchAccum>=Math.PI*40){
    if(wrenchPhase===0){wrenchPhase=1;wrenchAccum=0;$("#instruction").textContent="Bravo, c'est dévissé ! Maintenant revisse dans l'autre sens."}
    else win()
  }
}
function wrap(t,x,y,w,lh){let words=t.split(" "),line="",yy=y;for(let z of words){let test=line+z+" ";if(c.measureText(test).width>w){c.fillText(line,x,yy);line=z+" ";yy+=lh}else line=test}c.fillText(line,x,yy)}
function loop(){
  if(paused)return;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,cv.width,cv.height);
  if(game!==7&&game!==8&&game!==9)ang+=speed;
  frame();
  raf=requestAnimationFrame(loop)
}

function pos(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*720/r.width,y:(e.clientY-r.top)*1000/r.height}}
function hit(p,x,y,r=65){return Math.hypot(p.x-x,p.y-y)<r}
cv.addEventListener("pointerdown",e=>{
 if(paused)return;let p=pos(e);cv.setPointerCapture?.(e.pointerId);
 if(game===1){let i=assembly.findIndex(q=>phase==="remove"?!q.removed&&hit(p,q.homeX,q.homeY,55):!q.placed&&hit(p,q.x,q.y,60));if(i>=0){let q=assembly[i],sx=phase==="remove"?q.homeX:q.x,sy=phase==="remove"?q.homeY:q.y;drag={type:"assembly",i,dx:p.x-sx,dy:p.y-sy}}}
 else if(game===2){let i=puzzle.findIndex(q=>!q.done&&hit(p,q.x,q.y,95));if(i>=0)drag={type:"puzzle",i,dx:p.x-puzzle[i].x,dy:p.y-puzzle[i].y}}
 else if(game===3)memoryTap(p);
 else if(game===5){let i=mystery.findIndex(q=>hit(p,q.x,q.y,50));if(i>=0)drag={type:"mystery",i,dx:p.x-mystery[i].x,dy:p.y-mystery[i].y}}
 else if(game===6){clean(p);drag={type:"clean"}}
 else if(game===7){lastA=Math.atan2(p.y-420,p.x-360);drag={type:"spin"}}
 else if(game===8){paintAt(p);drag={type:"paint"}}
 else if(game===9){lastA=Math.atan2(p.y-430,p.x-360);drag={type:"wrench"}}
});
cv.addEventListener("pointermove",e=>{
 if(paused||!drag)return;let p=pos(e);
 if(drag.type==="assembly"){let q=assembly[drag.i];q.x=p.x-drag.dx;q.y=p.y-drag.dy}
 else if(drag.type==="puzzle"){let q=puzzle[drag.i];q.x=p.x-drag.dx;q.y=p.y-drag.dy}
 else if(drag.type==="mystery"){let q=mystery[drag.i];q.x=p.x-drag.dx;q.y=p.y-drag.dy}
 else if(drag.type==="clean")clean(p);
 else if(drag.type==="paint")paintAt(p);
 else if(drag.type==="spin"){let a=Math.atan2(p.y-420,p.x-360),d=a-lastA;if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;ang+=d;spinAccum+=Math.abs(d);lastA=a}
 else if(drag.type==="wrench"){let a=Math.atan2(p.y-430,p.x-360),d=a-lastA;if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;let wanted=wrenchPhase===0?-1:1;if(d*wanted>0){wrenchAngle+=d;wrenchAccum+=Math.abs(d)}lastA=a}
});
cv.addEventListener("pointerup",e=>{
 if(paused||!drag){drag=null;return}let p=pos(e);
 if(drag.type==="assembly"){let q=assembly[drag.i];if(phase==="remove"){if(p.y>690){q.removed=true;q.x=Math.max(65,Math.min(655,p.x));q.y=Math.max(760,Math.min(930,p.y))}else{q.x=q.homeX;q.y=q.homeY}if(assembly.every(z=>z.removed)){phase="replace";assembly.sort(()=>Math.random()-.5);assembly.forEach((z,i)=>{z.x=80+(i%5)*140;z.y=775+Math.floor(i/5)*105});$("#instruction").textContent="Remonte maintenant les pièces : dépose-les dans le grand rond de la bonne couleur."}}else{let targetX=170+q.m*190,targetY=430;if(hit(p,targetX,targetY,105)){q.placed=true;q.x=targetX;q.y=targetY;if(assembly.every(z=>z.placed))win()}else{$("#instruction").textContent="Presque ! Mets la pièce dans le grand rond de la même couleur."}}}
 else if(drag.type==="puzzle"){let q=puzzle[drag.i];if(hit(p,q.tx,q.ty,120)){q.done=true;q.x=q.tx;q.y=q.ty;if(puzzle.every(z=>z.done))win()}}
 else if(drag.type==="mystery"){let q=mystery[drag.i];if(hit(p,360,470,110)){if(q.correct)win();else{$("#instruction").textContent="Erreur : essaie une autre pièce.";q.x=120+drag.i*120;q.y=830}}else{q.x=120+drag.i*120;q.y=830}}
 drag=null
});
function paintAt(p){
  // broad forgiving spray area centered on the machine
  if(p.x>100&&p.x<620&&p.y>170&&p.y<690){
    paintDots.push({x:p.x+(Math.random()-.5)*10,y:p.y+(Math.random()-.5)*10,r:2.2+Math.random()*2.8,col:paintColor});
    paintProgress=Math.min(1,paintProgress+.00135);
  }
}
function clean(p){dirt.forEach(d=>{if(d.life>0&&hit(p,d.x,d.y,d.r+24))d.life--})}
function memoryTap(p){let i=cards.findIndex(q=>!q.done&&!q.open&&Math.abs(p.x-q.x)<64&&Math.abs(p.y-q.y)<67);if(i<0)return;cards[i].open=true;if(first===null)first=i;else{let j=first;first=null;if(cards[j].v===cards[i].v){cards[j].done=cards[i].done=true;matched+=2;if(matched===16)win()}else setTimeout(()=>{if(!paused){cards[j].open=false;cards[i].open=false}},600)}}
function beep(){try{let A=new(window.AudioContext||window.webkitAudioContext)(),g=A.createGain(),o=A.createOscillator();o.connect(g);g.connect(A.destination);o.frequency.setValueAtTime(523,A.currentTime);o.frequency.setValueAtTime(659,A.currentTime+.11);o.frequency.setValueAtTime(784,A.currentTime+.22);g.gain.setValueAtTime(.1,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+.46);o.start();o.stop(A.currentTime+.47)}catch(e){}}
function win(){if(won||paused)return;won=true;paused=true;cancelAnimationFrame(raf);stars++;$("#stars").textContent="★ "+stars;beep();$("#success").style.display="grid"}
</script>
